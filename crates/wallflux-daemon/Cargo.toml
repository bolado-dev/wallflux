[package]
name = "wallflux-daemon"
description = "wallflux render daemon (X11 and wlr-layer-shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "wallflux-daemon"
path = "src/main.rs"

[dependencies]
wallflux-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
clap = { version = "4", features = ["derive", "env"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

# X11 backend
x11rb = { version = "0.13", features = ["randr", "shape"] }

# Wayland backend
wayland-client = { version = "0.31", features = ["dlopen"] }
# The libwayland-backed backend, which is what exposes the raw wl_display and
# wl_surface pointers that EGL needs.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
